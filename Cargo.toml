[package]
name = "bayplan"
version = "0.1.0"
edition = "2024"
description = "Runs an isolated copy of part of a Docker Compose stack for each git worktree."
repository = "https://github.com/MaelBriantin/bayplan"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
axoupdater = { version = "0.10.3", features = ["blocking"] }
clap = { version = "4.6.8", features = ["derive"] }
regex = "1.13.2"
self-replace = "1.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[[bin]]
name = "bp"
path = "src/main.rs"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
